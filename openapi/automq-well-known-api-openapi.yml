openapi: 3.2.0
info:
  title: Automq .well Known API
  version: '2026-05-07'
  description: 'Operations tagged .well Known across 2 of this provider''s published API definitions: automq-wellknown-openapi.json, automq-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://www.automq.com
tags:
- name: .well Known
paths:
  /.well-known/api-catalog:
    get:
      operationId: getApiCatalog
      summary: Get the AutoMQ API catalog linkset
      responses:
        '200':
          description: RFC 9727 API catalog encoded as an RFC 9264 JSON linkset
          content:
            application/linkset+json:
              schema:
                $ref: '#/components/schemas/ApiCatalog'
      tags:
      - .well Known
    servers:
    - url: https://www.automq.com
  /.well-known/openapi.json:
    get:
      operationId: getPublicDiscoveryOpenApi
      summary: Get the OpenAPI description for AutoMQ public discovery endpoints
      responses:
        '200':
          description: OpenAPI description
          content:
            application/vnd.oai.openapi+json:
              schema:
                type: object
      tags:
      - .well Known
    servers:
    - url: https://www.automq.com
  /.well-known/api-status:
    get:
      operationId: getPublicDiscoveryStatus
      summary: Get status for AutoMQ public discovery endpoints
      responses:
        '200':
          description: Discovery endpoint status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - .well Known
    servers:
    - url: https://www.automq.com
  /.well-known/oauth-protected-resource:
    get:
      operationId: getOAuthProtectedResourceMetadata
      summary: Get OAuth Protected Resource Metadata for the AutoMQ website
      responses:
        '200':
          description: OAuth Protected Resource Metadata
          content:
            application/json:
              schema:
                type: object
      tags:
      - .well Known
    servers:
    - url: https://www.automq.com
  /.well-known/mcp/server-card.json:
    get:
      operationId: getMcpServerCard
      summary: Get the AutoMQ MCP Server Card
      responses:
        '200':
          description: MCP Server Card
          content:
            application/json:
              schema:
                type: object
      tags:
      - .well Known
    servers:
    - url: https://www.automq.com
  /.well-known/agent-skills/index.json:
    get:
      operationId: getAgentSkillsIndex
      summary: Get the AutoMQ Agent Skills discovery index
      responses:
        '200':
          description: Agent Skills discovery index
          content:
            application/json:
              schema:
                type: object
      tags:
      - .well Known
    servers:
    - url: https://www.automq.com
components:
  schemas:
    Status:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        updated:
          type: string
          format: date
        resources:
          type: array
          items:
            type: string
            format: uri
      required:
      - status
      - service
      - updated
      - resources
    ApiCatalog:
      type: object
      properties:
        linkset:
          type: array
          items:
            type: object
      required:
      - linkset
x-refined-from:
- automq-wellknown-openapi.json
- automq-openapi.yml
