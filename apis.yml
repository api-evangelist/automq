aid: automq
name: AutoMQ
image: https://www.automq.com/images/automq/og-image.webp
description: AutoMQ is a cloud-native, Kafka-compatible streaming platform that replaces
  Kafka broker local disks with shared S3-compatible object storage, offered as open
  source and as AutoMQ Cloud (BYOC). Developers use the Kafka protocol directly; AutoMQ
  Cloud resources are managed through an official Terraform provider, and the company
  publishes a public discovery OpenAPI, llms.txt and a documentation MCP server.
